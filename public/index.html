<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<meta name="theme-color" content="#e91e63">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="潘潘工作台">
<link rel="manifest" href="/manifest.json">
<link rel="apple-touch-icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Ctext y='.9em' font-size='90'%3E💅%3C/text%3E%3C/svg%3E">
<title>潘潘美甲美睫工作台</title>
<style>
* { margin:0; padding:0; box-sizing:border-box; -webkit-tap-highlight-color:transparent; }
body { font-family:-apple-system,BlinkMacSystemFont,'Segoe UI','PingFang SC','Hiragino Sans GB','Microsoft YaHei',sans-serif; background:#f5f5f5; color:#333; padding-bottom:60px; }
:root { --pink:#e91e63; --pink-light:#fce4ec; --pink-dark:#ad1457; --green:#4caf50; --orange:#ff9800; --red:#f44336; --blue:#2196f3; --purple:#9c27b0; }
.app-header { background:linear-gradient(135deg,var(--pink),var(--pink-dark)); color:#fff; padding:16px; text-align:center; position:sticky; top:0; z-index:100; box-shadow:0 2px 8px rgba(0,0,0,.15); }
.app-header h1 { font-size:20px; }
.app-header .sub { font-size:12px; opacity:.85; margin-top:4px; }
.container { max-width:600px; margin:0 auto; padding:12px; }
.card { background:#fff; border-radius:12px; padding:16px; margin-bottom:12px; box-shadow:0 1px 4px rgba(0,0,0,.08); }
.card h2 { font-size:16px; margin-bottom:12px; color:var(--pink); border-bottom:2px solid var(--pink-light); padding-bottom:8px; }
.btn { display:inline-block; padding:12px 24px; border:none; border-radius:8px; font-size:15px; cursor:pointer; transition:all .2s; text-align:center; text-decoration:none; color:#fff; background:var(--pink); width:100%; }
.btn:active { transform:scale(.97); }
.btn-green { background:var(--green); }
.btn-orange { background:var(--orange); }
.btn-red { background:var(--red); }
.btn-blue { background:var(--blue); }
.btn-gray { background:#999; }
.btn-purple { background:var(--purple); }
.btn-sm { padding:6px 10px; font-size:12px; width:auto; }
.btn-xs { padding:4px 8px; font-size:11px; width:auto; }
.btn-outline { background:#fff; color:var(--pink); border:2px solid var(--pink); }
input,select,textarea { width:100%; padding:12px; border:2px solid #e0e0e0; border-radius:8px; font-size:15px; margin-bottom:10px; outline:none; transition:border .2s; }
input:focus,select:focus,textarea:focus { border-color:var(--pink); }
label { display:block; font-size:14px; color:#666; margin-bottom:4px; margin-top:8px; }
.form-row { display:flex; gap:10px; }
.form-row > * { flex:1; }
.tab-bar { display:flex; background:#fff; position:fixed; bottom:0; left:0; right:0; box-shadow:0 -2px 8px rgba(0,0,0,.08); z-index:100; max-width:600px; margin:0 auto; }
.tab-bar .tab { flex:1; padding:10px 2px; text-align:center; font-size:11px; color:#999; cursor:pointer; border-top:3px solid transparent; }
.tab-bar .tab.active { color:var(--pink); border-top-color:var(--pink); font-weight:600; }
.tab-bar .tab .icon { font-size:18px; display:block; margin-bottom:2px; }
.list-item { display:flex; justify-content:space-between; align-items:center; padding:12px; border-bottom:1px solid #f0f0f0; }
.list-item:last-child { border-bottom:none; }
.list-item .info { flex:1; min-width:0; }
.list-item .info .name { font-size:15px; font-weight:500; word-break:break-all; }
.list-item .info .detail { font-size:12px; color:#999; margin-top:2px; }
.list-item .actions { display:flex; gap:4px; flex-shrink:0; }
.empty { text-align:center; padding:30px; color:#999; font-size:14px; }
.stat-grid { display:grid; grid-template-columns:repeat(2,1fr); gap:10px; margin-bottom:12px; }
.stat-box { background:linear-gradient(135deg,var(--pink-light),#fff); border-radius:10px; padding:14px; text-align:center; }
.stat-box .num { font-size:24px; font-weight:bold; color:var(--pink-dark); }
.stat-box .label { font-size:12px; color:#888; margin-top:4px; }
.stat-box.green { background:linear-gradient(135deg,#e8f5e9,#fff); }
.stat-box.green .num { color:var(--green); }
.stat-box.orange { background:linear-gradient(135deg,#fff3e0,#fff); }
.stat-box.orange .num { color:var(--orange); }
.stat-box.blue { background:linear-gradient(135deg,#e3f2fd,#fff); }
.stat-box.blue .num { color:var(--blue); }
.stat-box.purple { background:linear-gradient(135deg,#f3e5f5,#fff); }
.stat-box.purple .num { color:var(--purple); }
.toast { position:fixed; top:50%; left:50%; transform:translate(-50%,-50%); background:rgba(0,0,0,.8); color:#fff; padding:12px 24px; border-radius:8px; font-size:14px; z-index:9999; opacity:0; transition:opacity .3s; pointer-events:none; }
.toast.show { opacity:1; }
.modal-overlay { position:fixed; top:0; left:0; right:0; bottom:0; background:rgba(0,0,0,.5); z-index:200; display:none; align-items:center; justify-content:center; padding:20px; }
.modal-overlay.show { display:flex; }
.modal { background:#fff; border-radius:12px; padding:20px; width:100%; max-width:400px; max-height:80vh; overflow-y:auto; }
.modal h3 { font-size:18px; margin-bottom:16px; color:var(--pink); text-align:center; }
.hidden { display:none !important; }
.text-center { text-align:center; }
.text-pink { color:var(--pink); }
.text-green { color:var(--green); }
.text-red { color:var(--red); }
.text-orange { color:var(--orange); }
.text-purple { color:var(--purple); }
.mt-10 { margin-top:10px; }
.mt-20 { margin-top:20px; }
.mb-10 { margin-bottom:10px; }
.mb-5 { margin-bottom:5px; }
.flex { display:flex; align-items:center; }
.flex-between { display:flex; justify-content:space-between; align-items:center; }
.gap-10 { gap:10px; }
table { width:100%; border-collapse:collapse; font-size:13px; }
table th { background:var(--pink-light); padding:8px; text-align:left; color:var(--pink-dark); white-space:nowrap; }
table td { padding:8px; border-bottom:1px solid #f0f0f0; }
.section-title { font-size:14px; color:#999; margin:16px 0 8px; padding-left:4px; }
.role-switch { display:flex; gap:10px; margin-bottom:16px; }
.role-switch .role-btn { flex:1; padding:14px; border-radius:10px; text-align:center; border:2px solid #e0e0e0; background:#fff; cursor:pointer; font-size:15px; }
.role-switch .role-btn.active { border-color:var(--pink); background:var(--pink-light); color:var(--pink-dark); font-weight:600; }
.tag { display:inline-block; padding:2px 8px; border-radius:4px; font-size:11px; margin-left:4px; }
.tag-default { background:#e0e0e0; color:#666; }
.tag-custom { background:var(--pink-light); color:var(--pink-dark); }
.tag-green { background:#e8f5e9; color:var(--green); }
.tag-blue { background:#e3f2fd; color:var(--blue); }
.tag-done { background:#c8e6c9; color:#2e7d32; }
.tag-pending { background:#fff9c4; color:#f57f17; }
</style>
</head>
<body>

<div class="app-header">
<h1>💅 潘潘美甲美睫工作台</h1>
<div class="sub">业绩记录 · 员工管理 · 会员储值 · 实时同步</div>
</div>

<div id="loginPage" class="container">
<div class="card">
<h2>选择身份登录</h2>
<div class="role-switch">
<div class="role-btn active" onclick="switchRole('boss')">👑 老板端</div>
<div class="role-btn" onclick="switchRole('staff')">💅 员工端</div>
</div>
<div id="bossLogin">
<label>老板密码</label>
<input type="password" id="bossPwd" placeholder="请输入老板密码">
<button class="btn" onclick="loginBoss()">进入老板端</button>
</div>
<div id="staffLogin" class="hidden">
<label>员工姓名</label>
<input type="text" id="staffName" placeholder="请输入姓名">
<label>员工密码</label>
<input type="password" id="staffPwd" placeholder="请输入密码">
<button class="btn btn-green" onclick="loginStaff()">进入员工端</button>
</div>
</div>
</div>

<div id="mainApp" class="hidden">

<div id="page-home" class="container">
<div class="stat-grid" id="homeStats">
<div class="stat-box"><div class="num" id="statToday">0</div><div class="label">今日业绩(元)</div></div>
<div class="stat-box green"><div class="num" id="statMonth">0</div><div class="label">本月业绩(元)</div></div>
<div class="stat-box orange"><div class="num" id="statRecords">0</div><div class="label">总记录数</div></div>
<div class="stat-box blue"><div class="num" id="statStaff">0</div><div class="label">员工人数</div></div>
<div class="stat-box purple"><div class="num" id="statMembers">0</div><div class="label">会员人数</div></div>
<div class="stat-box green"><div class="num" id="statBalance">0</div><div class="label">会员总余额(元)</div></div>
</div>
<div class="card" id="quickActions">
<h2>📊 快捷操作</h2>
<div class="form-row">
<button class="btn btn-green" onclick="navTo('record')">📝 录业绩</button>
<button class="btn btn-blue" onclick="navTo('appointment')">📅 预约</button>
</div>
<div class="form-row mt-10">
<button class="btn btn-orange" onclick="navTo('report')">📈 对账</button>
<button class="btn btn-purple" onclick="navTo('project')">💅 项目</button>
</div>
</div>
<div class="card" id="todayRecordsCard">
<h2>🕐 今日记录</h2>
<div id="todayRecordsList"></div>
</div>
</div>

<div id="page-record" class="container hidden">
<div class="card">
<h2>📝 录入业绩</h2>
<input type="hidden" id="editRecordId">
<label>选择员工</label>
<select id="recStaff" onchange="calcCommission()"></select>
<label>选择项目</label>
<select id="recProject" onchange="onProjectChange()"></select>
<label>客户类型</label>
<select id="recType" onchange="onTypeChange()">
<option value="散客">散客</option>
<option value="团购">团购</option>
<option value="会员卡">会员卡</option>
</select>
<div id="memberSelectBox" class="hidden">
<label>选择会员</label>
<select id="recMember" onchange="onMemberChange()"></select>
<div id="memberBalanceInfo" class="text-green" style="font-size:13px;margin-bottom:8px;"></div>
</div>
<div class="form-row">
<div><label>金额(元)</label><input type="number" id="recAmount" placeholder="0" oninput="calcCommission()"></div>
<div><label>提成比例(%)</label><input type="number" id="recRate" placeholder="自动" oninput="calcCommission()"></div>
</div>
<div class="form-row">
<div><label>提成(元)</label><input type="number" id="recCommission" placeholder="0" readonly></div>
<div><label>日期</label><input type="date" id="recDate"></div>
</div>
<label>备注(可选)</label><input type="text" id="recNote" placeholder="备注信息">
<div id="rateInfo" style="font-size:12px;color:#999;margin-bottom:8px;"></div>
<div class="form-row">
<button class="btn btn-green" onclick="submitRecord()">✅ 提交业绩</button>
<button class="btn btn-gray hidden" id="cancelEditBtn" onclick="cancelEdit()">取消编辑</button>
</div>
</div>
</div>

<div id="page-appointment" class="container hidden">
<div class="card">
<h2>📅 预约管理</h2>
<button class="btn btn-blue mb-10" onclick="showApptModal()">➕ 新建预约</button>
<div id="apptList"></div>
</div>
</div>

<div id="page-project" class="container hidden">
<div class="card">
<h2>💅 项目管理</h2>
<button class="btn btn-purple mb-10" onclick="showProjectModal()">➕ 添加项目</button>
<div id="projectFilter" class="mb-10" style="display:flex;gap:6px;">
<button class="btn btn-sm" style="background:var(--pink)" onclick="filterProjects('all')">全部</button>
<button class="btn btn-sm btn-outline" onclick="filterProjects('美甲')">💅 美甲</button>
<button class="btn btn-sm btn-outline" onclick="filterProjects('美睫')">👁 美睫</button>
<button class="btn btn-sm btn-outline" onclick="filterProjects('其他')">📦 其他</button>
</div>
<div id="projectList"></div>
</div>
</div>

<div id="page-staff" class="container hidden">
<div class="card">
<h2>👥 员工管理</h2>
<button class="btn mb-10" onclick="showStaffModal()">➕ 添加员工</button>
<div id="staffList"></div>
</div>
<div class="card">
<h2>💰 默认提成方案（按客户类型）</h2>
<div id="rulesList"></div>
<button class="btn btn-orange mt-10" onclick="showRulesModal()">✏️ 修改默认提成方案</button>
</div>
<div class="card">
<h2>👤 会员管理</h2>
<button class="btn btn-purple mb-10" onclick="showMemberModal()">➕ 添加会员</button>
<div id="memberList"></div>
</div>
</div>

<div id="page-report" class="container hidden">
<div class="card">
<h2>📈 业绩对账</h2>
<div class="form-row">
<div><label>开始日期</label><input type="date" id="reportStart"></div>
<div><label>结束日期</label><input type="date" id="reportEnd"></div>
</div>
<div class="form-row">
<div><label>选择员工</label><select id="reportStaff"><option value="">全部员工</option></select></div>
<div><label>项目分类</label><select id="reportCategory"><option value="">全部分类</option><option value="美甲">美甲</option><option value="美睫">美睫</option><option value="其他">其他</option></select></div>
</div>
<div class="form-row">
<div><label>搜索关键词</label><input type="text" id="reportSearch" placeholder="项目/员工/备注/金额"></div>
</div>
<button class="btn btn-orange mb-10" onclick="loadReport()">🔍 查询</button>
<div id="reportResult"></div>
</div>
</div>
</div>

<div id="tabBar" class="tab-bar hidden">
<div class="tab active" onclick="navTo('home')"><span class="icon">🏠</span>首页</div>
<div class="tab" onclick="navTo('record')"><span class="icon">📝</span>录业绩</div>
<div class="tab" onclick="navTo('appointment')"><span class="icon">📅</span>预约</div>
<div class="tab" onclick="navTo('report')"><span class="icon">📈</span>对账</div>
<div class="tab" onclick="navTo('project')"><span class="icon">💅</span>项目</div>
<div class="tab" onclick="navTo('staff')"><span class="icon">👥</span>管理</div>
</div>

<div class="modal-overlay" id="modalOverlay"><div class="modal" id="modalContent"></div></div>
<div class="toast" id="toast"></div>

<script>
let appData = { rules:{}, projects:[], staff:[], members:[], records:[], appointments:[] };
let currentRole = 'boss';
let currentStaff = null;
let currentPage = 'home';
let savedBossPwd = '';
let projectFilter = 'all';

const API = {
  get: () => fetch('/api/data').then(r => r.json()),
  save: (data) => fetch('/api/data', { method:'POST', headers:{'Content-Type':'application/json'}, body:JSON.stringify(data) }).then(r => r.json()),
  verifyBoss: (pwd) => fetch('/api/verify-boss', { method:'POST', headers:{'Content-Type':'application/json'}, body:JSON.stringify({password:pwd}) }).then(r => r.json()),
  exportReport: (body) => fetch('/api/export-report', { method:'POST', headers:{'Content-Type':'application/json'}, body:JSON.stringify(body) }).then(r => r.json()),
};

function showToast(msg) {
  const t = document.getElementById('toast'); t.textContent = msg; t.classList.add('show');
  setTimeout(() => t.classList.remove('show'), 2000);
}
function showModal(html) { document.getElementById('modalContent').innerHTML = html; document.getElementById('modalOverlay').classList.add('show'); }
function closeModal() { document.getElementById('modalOverlay').classList.remove('show'); }
function todayStr() { const d = new Date(); return d.getFullYear() + '-' + String(d.getMonth()+1).padStart(2,'0') + '-' + String(d.getDate()).padStart(2,'0'); }
function monthStr() { const d = new Date(); return d.getFullYear() + '-' + String(d.getMonth()+1).padStart(2,'0'); }
function fmtDate(d) { if (!d) return ''; return d.substring(5).replace('-','/'); }
function genId() { return Date.now().toString() + Math.random().toString(36).substr(2, 5); }
function esc(s) { if (!s) return ''; return String(s).replace(/&/g,'&').replace(/</g,'<').replace(/>/g,'>').replace(/"/g,'"').replace(/'/g,'''); }

function getCommissionRate(staffName, projectName, type) {
  const staff = appData.staff.find(s => s.name === staffName);
  const project = appData.projects.find(p => p.name === projectName);
  const defaultRate = appData.rules[type] || 0;
  let rate = defaultRate, source = '默认比例';
  if (project && project.commissionRate !== null && project.commissionRate !== undefined) { rate = project.commissionRate; source = '项目比例'; }
  if (staff && staff.commissionRates) {
    const sr = staff.commissionRates[type];
    if (sr !== null && sr !== undefined) { rate = sr; source = '员工比例'; }
  }
  return { rate, source };
}
function calcCommission() {
  const staffName = document.getElementById('recStaff').value;
  const projectName = document.getElementById('recProject').value;
  const type = document.getElementById('recType').value;
  const amount = parseFloat(document.getElementById('recAmount').value) || 0;
  const manualRate = document.getElementById('recRate').value;
  let rate, source;
  if (manualRate !== '') { rate = parseFloat(manualRate) || 0; source = '手动输入'; }
  else { const r = getCommissionRate(staffName, projectName, type); rate = r.rate; source = r.source; }
  document.getElementById('recCommission').value = (amount * rate / 100).toFixed(2);
  document.getElementById('rateInfo').innerHTML = '提成来源: <span class="text-pink">' + source + '</span> | 比例: <span class="text-pink">' + rate + '%</span>';
}

async function loadData() {
  try {
    appData = await API.get();
    if (!appData.rules) appData.rules = { '散客':0, '团购':0, '会员卡':0 };
    if (!appData.projects) appData.projects = [];
    if (!appData.staff) appData.staff = [];
    if (!appData.members) appData.members = [];
    if (!appData.records) appData.records = [];
    if (!appData.appointments) appData.appointments = [];
    return true;
  } catch(e) { showToast('网络错误'); return false; }
}
async function saveData() { const r = await API.save(appData); if (!r.success) showToast('保存失败'); return r.success; }

function switchRole(role) {
  currentRole = role;
  document.querySelectorAll('.role-btn').forEach(b => {
    b.classList.remove('active');
    if ((role === 'boss' && b.textContent.includes('老板')) || (role === 'staff' && b.textContent.includes('员工'))) {
      b.classList.add('active');
    }
  });
  document.getElementById('bossLogin').classList.toggle('hidden', role !== 'boss');
  document.getElementById('staffLogin').classList.toggle('hidden', role !== 'staff');
}
async function loginBoss() {
  const pwd = document.getElementById('bossPwd').value.trim();
  if (!pwd) { showToast('请输入密码'); return; }
  const res = await API.verifyBoss(pwd);
  if (res.success) { currentRole = 'boss'; savedBossPwd = pwd; await enterApp(); }
  else showToast('密码错误');
}
async function loginStaff() {
  const name = document.getElementById('staffName').value.trim();
  const pwd = document.getElementById('staffPwd').value.trim();
  if (!name || !pwd) { showToast('请输入完整'); return; }
  await loadData();
  const staff = appData.staff.find(s => s.name === name && s.password === pwd);
  if (staff) { currentRole = 'staff'; currentStaff = staff; await enterApp(); }
  else showToast('姓名或密码错误');
}
async function enterApp() {
  document.getElementById('loginPage').classList.add('hidden');
  document.getElementById('mainApp').classList.remove('hidden');
  document.getElementById('tabBar').classList.remove('hidden');
  await loadData();
  updateTabVisibility();
  renderHome();
  navTo('home');
}
function updateTabVisibility() {
  const tabs = document.querySelectorAll('.tab');
  if (currentRole === 'staff') {
    tabs[0].style.display = ''; tabs[1].style.display = '';
    tabs[2].style.display = ''; tabs[3].style.display = '';
    tabs[4].style.display = 'none'; tabs[5].style.display = 'none';
  } else { tabs.forEach(t => t.style.display = ''); }
}
function logout() {
  currentRole = 'boss'; currentStaff = null; savedBossPwd = '';
  document.getElementById('mainApp').classList.add('hidden');
  document.getElementById('tabBar').classList.add('hidden');
  document.getElementById('loginPage').classList.remove('hidden');
}

function navTo(page) {
  if (currentRole === 'staff' && !['home','record','report','appointment'].includes(page)) {
    showToast('员工无权访问此页面'); return;
  }
  currentPage = page;
  document.querySelectorAll('#mainApp > .container').forEach(c => c.classList.add('hidden'));
  const el = document.getElementById('page-' + page);
  if (el) el.classList.remove('hidden');
  document.querySelectorAll('.tab').forEach(t => t.classList.remove('active'));
  const tabMap = { home:0, record:1, appointment:2, report:3, project:4, staff:5 };
  const tabs = document.querySelectorAll('.tab');
  if (tabs[tabMap[page]]) tabs[tabMap[page]].classList.add('active');
  if (page === 'home') renderHome();
  else if (page === 'record') renderRecord();
  else if (page === 'appointment') renderAppointment();
  else if (page === 'staff') renderStaff();
  else if (page === 'project') renderProject();
  else if (page === 'report') renderReport();
}

function renderHome() {
  const today = todayStr(), month = monthStr();
  const todayRecs = appData.records.filter(r => r.date === today);
  const monthRecs = appData.records.filter(r => r.date && r.date.startsWith(month));
  const todayTotal = todayRecs.reduce((s,r) => s + (parseFloat(r.amount)||0), 0);
  const monthTotal = monthRecs.reduce((s,r) => s + (parseFloat(r.amount)||0), 0);
  const totalBalance = appData.members.reduce((s,m) => s + (parseFloat(m.balance)||0), 0);
  document.getElementById('statToday').textContent = todayTotal.toFixed(0);
  document.getElementById('statMonth').textContent = monthTotal.toFixed(0);

}
async function delRecord(id) {

function onMemberChange() {

async function submitRecord() {
  const editId = document.getElementById('editRecordId').value;
  const staffName = document.getElementById('recStaff').value;
  const projectName = document.getElementById('recProject').value;
  const type = document.getElementById('recType').value;
  const amount = parseFloat(document.getElementById('recAmount').value) || 0;
  const commission = parseFloat(document.getElementById('recCommission').value) || 0;
  const note = document.getElementById('recNote').value.trim();
  const date = document.getElementById('recDate').value || todayStr();
  const memberSel = document.getElementById('recMember');
  const memberId = (type === '会员卡' && memberSel) ? memberSel.value : '';
  const member = memberId ? appData.members.find(m => m.id === memberId) : null;
  if (!staffName || !projectName || amount <= 0) { showToast('请填写完整'); return; }

  if (editId) {
    const r = appData.records.find(r => r.id === editId);
    if (!r) return;
    if (r.type === '会员卡' && r.memberId) {
      const oldM = appData.members.find(m => m.id === r.memberId);
      if (oldM) oldM.balance = (parseFloat(oldM.balance)||0) + (parseFloat(r.amount)||0);
    }
    r.staffName = staffName; r.projectName = projectName; r.type = type;
    r.amount = amount; r.commission = commission; r.note = note; r.date = date;
    r.memberId = memberId || null; r.memberName = member ? member.name : null;
    if (type === '会员卡' && member) {
      if (member.balance < amount) { showToast('会员余额不足'); return; }
      member.balance = parseFloat(member.balance) - amount;
    }
    if (await saveData()) { showToast('✅ 修改已保存'); cancelEdit(); navTo('home'); }
  } else {
    if (type === '会员卡' && member) {
      if (member.balance < amount) { showToast('会员余额不足（余额¥'+member.balance+'）'); return; }
      member.balance = parseFloat(member.balance) - amount;
    }
    appData.records.push({
      id: genId(), staffName, projectName, type, amount, commission, note,
      date, time: new Date().toTimeString().substring(0,5),
      createdBy: currentRole === 'staff' ? currentStaff.name : 'boss',
      memberId: memberId || null, memberName: member ? member.name : null
    });
    if (await saveData()) { showToast('✅ 录入成功'); navTo('home'); }
  }
}

async function saveAppt(editId) {
  const customerName = document.getElementById('apptName').value.trim();

  const time = document.getElementById('apptTime').value;

}
async function saveEditProject(pid) {
  const p = appData.projects.find(p => p.id === pid); if (!p) return;
  p.name = document.getElementById('editProjName').value.trim();
  p.category = document.getElementById('editProjCat').value;
  p.price = parseFloat(document.getElementById('editProjPrice').value) || 0;
  const rs = document.getElementById('editProjRate').value.trim();
  p.commissionRate = rs==='' ? null : (parseFloat(rs)||0);
  if (!p.name) { showToast('请输入项目名'); return; }
  if (await saveData()) { showToast('✅ 已保存'); closeModal(); renderProject(); }
}
async function delProject(id) {
  const p = appData.projects.find(p => p.id === id);
  if (!p || !confirm('删除「' + p.name + '」？')) return;
  appData.projects = appData.projects.filter(p => p.id !== id);
  if (await saveData()) { showToast('已删除'); renderProject(); }
}

// ============ 会员管理 ============
function renderMembers() {
  const list = document.getElementById('memberList'); if (!list) return;
  if (appData.members.length === 0) { list.innerHTML = '<div class="empty">暂无会员</div>'; return; }
  list.innerHTML = appData.members.map(m => '<div class="list-item"><div class="info"><div class="name">' + esc(m.name) + ' <span class="tag tag-green">余额¥' + (parseFloat(m.balance)||0).toFixed(2) + '</span></div><div class="detail">' + (m.phone||'无电话') + ' | 卡号:' + (m.cardNo||'无') + ' | 充值' + ((m.rechargeHistory||[]).length) + '次</div></div><div class="actions"><button class="btn btn-xs btn-green" onclick="showRechargeModal(\'' + m.id + '\')">充值</button><button class="btn btn-xs btn-blue" onclick="showEditMemberModal(\'' + m.id + '\')">✏️</button><button class="btn btn-xs btn-red" onclick="delMember(\'' + m.id + '\')">🗑</button></div></div>').join('');
}
function showMemberModal() {
  showModal('<h3>👤 添加会员</h3><label>会员姓名</label><input type="text" id="newMemName" placeholder="姓名"><label>手机号</label><input type="tel" id="newMemPhone" placeholder="手机号"><label>卡号</label><input type="text" id="newMemCardNo" placeholder="卡号"><label>初始余额(元)</label><input type="number" id="newMemBalance" value="0"><button class="btn btn-purple mt-10" onclick="addMember()">✅ 添加</button><button class="btn btn-gray mt-10" onclick="closeModal()">取消</button>');
}
async function addMember() {
  const name = document.getElementById('newMemName').value.trim();
  const phone = document.getElementById('newMemPhone').value.trim();
  const cardNo = document.getElementById('newMemCardNo').value.trim();
  const balance = parseFloat(document.getElementById('newMemBalance').value) || 0;
  if (!name) { showToast('请输入姓名'); return; }
  const m = { id: genId(), name, phone, cardNo, balance, rechargeHistory: [] };
  if (balance > 0) m.rechargeHistory.push({ amount: balance, date: todayStr(), note: '初始充值' });
  appData.members.push(m);
  if (await saveData()) { showToast('✅ 添加成功'); closeModal(); renderMembers(); }
}
function showEditMemberModal(mid) {
  const m = appData.members.find(m => m.id === mid); if (!m) return;
  showModal('<h3>👤 编辑会员</h3><label>姓名</label><input type="text" id="editMemName" value="' + esc(m.name) + '"><label>手机号</label><input type="tel" id="editMemPhone" value="' + (m.phone||'') + '"><label>卡号</label><input type="text" id="editMemCardNo" value="' + (m.cardNo||'') + '"><label>余额(元)</label><input type="number" id="editMemBalance" value="' + (m.balance||0) + '" readonly><button class="btn btn-blue mt-10" onclick="saveEditMember(\'' + m.id + '\')">✅ 保存</button><button class="btn btn-gray mt-10" onclick="closeModal()">取消</button>');
}
async function saveEditMember(mid) {
  const m = appData.members.find(m => m.id === mid); if (!m) return;
  m.name = document.getElementById('editMemName').value.trim();
  m.phone = document.getElementById('editMemPhone').value.trim();
  m.cardNo = document.getElementById('editMemCardNo').value.trim();
  if (!m.name) { showToast('请输入姓名'); return; }
  if (await saveData()) { showToast('✅ 已保存'); closeModal(); renderMembers(); }
}
function showRechargeModal(mid) {
  const m = appData.members.find(m => m.id === mid); if (!m) return;
  let rh = '';
  if (m.rechargeHistory && m.rechargeHistory.length > 0) {
    rh = '<div class="section-title">充值记录</div><table><tr><th>日期</th><th>金额</th><th>备注</th></tr>';
    m.rechargeHistory.slice().reverse().forEach(r => { rh += '<tr><td>' + fmtDate(r.date) + '</td><td>¥' + r.amount + '</td><td>' + (r.note||'') + '</td></tr>'; });
    rh += '</table>';
  }
  showModal('<h3>💰 充值 - ' + esc(m.name) + '</h3><p>余额: <span class="text-green" style="font-size:18px;font-weight:bold">¥' + (m.balance||0) + '</span></p><label>金额(元)</label><input type="number" id="rechargeAmount"><label>备注</label><input type="text" id="rechargeNote" placeholder="微信充值"><button class="btn btn-green mt-10" onclick="doRecharge(\'' + m.id + '\')">✅ 确认</button><button class="btn btn-gray mt-10" onclick="closeModal()">取消</button>' + rh);
}
async function doRecharge(mid) {
  const m = appData.members.find(m => m.id === mid); if (!m) return;
  const amount = parseFloat(document.getElementById('rechargeAmount').value) || 0;
  if (amount <= 0) { showToast('请输入金额'); return; }
  m.balance = (parseFloat(m.balance)||0) + amount;
  if (!m.rechargeHistory) m.rechargeHistory = [];
  m.rechargeHistory.push({ amount, date: todayStr(), note: document.getElementById('rechargeNote').value.trim() });
  if (await saveData()) { showToast('✅ 充值成功'); closeModal(); renderMembers(); }
}
async function delMember(id) {
  const m = appData.members.find(m => m.id === id);
  if (!m || !confirm('删除「' + m.name + '」？余额¥' + m.balance + '将清零。')) return;
  appData.members = appData.members.filter(m => m.id !== id);
  if (await saveData()) { showToast('已删除'); renderMembers(); }
}

// ============ 对账 ============
function renderReport() {
  const today = todayStr();
  const ma = new Date(); ma.setMonth(ma.getMonth()-1);
  const ms = ma.getFullYear()+'-'+String(ma.getMonth()+1).padStart(2,'0')+'-'+String(ma.getDate()).padStart(2,'0');
  document.getElementById('reportStart').value = ms;
  document.getElementById('reportEnd').value = today;
  document.getElementById('reportStaff').innerHTML = '<option value="">全部员工</option>' + appData.staff.map(s => '<option value="' + s.name + '">' + s.name + '</option>').join('');
  document.getElementById('reportSearch').value = '';
  loadReport();
}

async function loadReport() {
  const start = document.getElementById('reportStart').value;
  const end = document.getElementById('reportEnd').value;
  const filterStaff = document.getElementById('reportStaff').value;
  const filterCat = document.getElementById('reportCategory').value;
  const search = document.getElementById('reportSearch').value.trim().toLowerCase();

  let records;
  if (currentRole === 'boss') {
    const res = await API.exportReport({ bossPassword: savedBossPwd || '0911', startDate: start, endDate: end });
    records = res.records || [];
  } else {
    records = appData.records.filter(r => r.staffName === currentStaff.name && (!r.date || (r.date >= start && r.date <= end)));
  }

  if (filterStaff) records = records.filter(r => r.staffName === filterStaff);
  if (filterCat) records = records.filter(r => {
    const p = appData.projects.find(p => p.name === r.projectName);
    return p && (p.category||'其他') === filterCat;
  });
  if (search) records = records.filter(r =>
    (r.staffName||'').includes(search) || (r.projectName||'').includes(search) ||
    (r.note||'').includes(search) || String(r.amount).includes(search) ||
    (r.type||'').includes(search)
  );

  const totalAmount = records.reduce((s,r) => s + (parseFloat(r.amount)||0), 0);
  const totalCommission = records.reduce((s,r) => s + (parseFloat(r.commission)||0), 0);

  let totalRecharge = 0, rechargeRecords = [];
  appData.members.forEach(m => { (m.rechargeHistory||[]).forEach(r => { if (r.date >= start && r.date <= end) { totalRecharge += parseFloat(r.amount)||0; rechargeRecords.push({ name: m.name, amount: r.amount, date: r.date, note: r.note }); } }); });

  let staffSummary = {};
  records.forEach(r => {
    if (!staffSummary[r.staffName]) staffSummary[r.staffName] = { count:0, amount:0, commission:0 };
    staffSummary[r.staffName].count++; staffSummary[r.staffName].amount += parseFloat(r.amount)||0; staffSummary[r.staffName].commission += parseFloat(r.commission)||0;
  });

  const todayOnly = (start === end);
  const exportBtn = todayOnly
    ? '<button class="btn btn-blue mb-10" onclick="exportDayReport()">📋 导出 ' + start + ' 业绩文本</button>'
    : '<button class="btn btn-blue mb-10" onclick="exportMonthReport()">📋 导出月度明细</button>';

  let result = '<div class="stat-grid"><div class="stat-box"><div class="num">' + records.length + '</div><div class="label">总笔数</div></div><div class="stat-box green"><div class="num">' + totalAmount.toFixed(0) + '</div><div class="label">总金额(元)</div></div><div class="stat-box orange"><div class="num">' + totalCommission.toFixed(0) + '</div><div class="label">总提成(元)</div></div></div><div class="stat-grid"><div class="stat-box purple"><div class="num">' + totalRecharge.toFixed(0) + '</div><div class="label">会员充值</div></div></div>';

  if (currentRole === 'boss' || currentRole === 'staff') result += exportBtn;

  result += '<div class="section-title">按员工汇总</div><table><tr><th>员工</th><th>笔数</th><th>金额</th><th>提成</th></tr>';
  result += Object.entries(staffSummary).map(([n,s]) => '<tr><td>' + n + '</td><td>' + s.count + '</td><td>¥' + s.amount.toFixed(0) + '</td><td>¥' + s.commission.toFixed(2) + '</td></tr>').join('');
  result += '</table><div class="section-title">业绩明细</div><table><tr><th>日期</th><th>时间</th><th>员工</th><th>项目</th><th>类型</th><th>金额</th><th>提成</th></tr>';
  result += records.slice().reverse().map(r => '<tr><td>' + fmtDate(r.date) + '</td><td>' + (r.time||'') + '</td><td>' + esc(r.staffName) + '</td><td>' + esc(r.projectName) + '</td><td>' + esc(r.type) + '</td><td>¥' + r.amount + '</td><td>¥' + r.commission + '</td></tr>').join('');
  result += '</table>';

  document.getElementById('reportResult').innerHTML = result;
  window._reportRecords = records;
  window._reportStaffSummary = staffSummary;
  window._reportStart = start;
  window._reportEnd = end;
  window._reportTotalAmount = totalAmount;
  window._reportTotalCommission = totalCommission;
}

function exportDayReport() {
  const records = window._reportRecords || [];
  const staffSummary = window._reportStaffSummary || {};
  const date = window._reportStart || todayStr();
  const totalAmount = window._reportTotalAmount || 0;
  const totalCommission = window._reportTotalCommission || 0;

  let text = '===== 潘潘美甲美睫工作台 =====\n';
  text += '单日业绩报表 - ' + date + '\n';
  text += '生成时间: ' + new Date().toLocaleString() + '\n\n';
  text += '【汇总】\n';
  text += '总笔数: ' + records.length + ' | 总金额: ¥' + totalAmount.toFixed(0) + ' | 总提成: ¥' + totalCommission.toFixed(0) + '\n\n';
  text += '【按员工】\n';
  Object.entries(staffSummary).forEach(([n,s]) => { text += n + ': ' + s.count + '笔 | 金额¥' + s.amount.toFixed(0) + ' | 提成¥' + s.commission.toFixed(2) + '\n'; });
  text += '\n【明细】\n';
  records.forEach(r => { text += r.date + ' ' + (r.time||'') + ' | ' + r.staffName + ' | ' + r.projectName + ' | ' + r.type + ' | ¥' + r.amount + ' | 提成¥' + r.commission + (r.note ? ' | ' + r.note : '') + '\n'; });

  downloadText('业绩报表_' + date + '.txt', text);
}

function exportMonthReport() {
  const records = window._reportRecords || [];
  const staffSummary = window._reportStaffSummary || {};
  const start = window._reportStart || '';
  const end = window._reportEnd || '';
  const totalAmount = window._reportTotalAmount || 0;
  const totalCommission = window._reportTotalCommission || 0;

  let text = '===== 潘潘美甲美睫工作台 =====\n';
  text += '月度业绩明细 - ' + start + ' 至 ' + end + '\n';
  text += '生成时间: ' + new Date().toLocaleString() + '\n\n';
  text += '【汇总】\n';
  text += '总笔数: ' + records.length + ' | 总金额: ¥' + totalAmount.toFixed(0) + ' | 总提成: ¥' + totalCommission.toFixed(0) + '\n\n';
  text += '【按员工】\n';
  Object.entries(staffSummary).forEach(([n,s]) => { text += n + ': ' + s.count + '笔 | 金额¥' + s.amount.toFixed(0) + ' | 提成¥' + s.commission.toFixed(2) + '\n'; });
  text += '\n【明细】\n';
  let byDate = {};
  records.forEach(r => { if (!byDate[r.date]) byDate[r.date] = []; byDate[r.date].push(r); });
  Object.keys(byDate).sort().forEach(d => {
    text += '\n--- ' + d + ' ---\n';
    byDate[d].forEach(r => { text += '  ' + (r.time||'') + ' | ' + r.staffName + ' | ' + r.projectName + ' | ' + r.type + ' | ¥' + r.amount + ' | 提成¥' + r.commission + (r.note ? ' | ' + r.note : '') + '\n'; });
  });

  downloadText('业绩明细_' + start + '_' + end + '.txt', text);
}

function downloadText(filename, text) {
  const blob = new Blob(['\uFEFF' + text], { type: 'text/plain;charset=utf-8' });
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url; a.download = filename;
  document.body.appendChild(a); a.click();
  document.body.removeChild(a); URL.revokeObjectURL(url);
  showToast('✅ 已导出: ' + filename);
}

if ('serviceWorker' in navigator) { navigator.serviceWorker.register('/sw.js').catch(() => {}); }
document.getElementById('modalOverlay').addEventListener('click', function(e) { if (e.target === this) closeModal(); });
