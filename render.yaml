# Render 部署配置文件
# 文档: https://render.com/docs/render.yaml

services:
  - type: web
    name: panpan-nail-workbench
    env: node
    buildCommand: npm install
    startCommand: node server.js
    plan: free
    healthCheckPath: /api/status
    envVars:
      - key: SUPABASE_URL
        sync: false
      - key: SUPABASE_KEY
        sync: false
      - key: BOSS_PWD
        sync: false
